name: KenkePhene Emulator Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo "Kiểm tra và kích hoạt tăng tốc phần cứng KVM..."
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -a -G kvm $USER

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator & Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2000M
          heap-size: 256M
          disable-animations: true
          avd-name: kenkephene_test
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Đang chờ máy ảo boot hoàn tất..."
            adb wait-for-device
            # Chờ thêm đến khi hệ thống sẵn sàng hẳn
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              echo "Đang khởi động..."
              sleep 5
            done
            echo "Máy ảo KenkePhene đã khởi động thành công và sẵn sàng!"
            adb shell pm list packages
