name: KenkePhene Emulator Web GUI

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator (Stable Headless + Auto GUI Export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2000M
          heap-size: 256M
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Đang khởi động KenkePhene OS..."
            adb wait-for-device
            
            # Chờ boot xong
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              sleep 5
            done
            echo "KenkePhene OS đã sẵn sàng!"
            
            # Mở khóa và chụp lại màn hình giao diện thực tế của hệ điều hành
            adb shell input keyevent 82
            adb shell input keyevent 3
            sleep 2
            
            adb shell screencap -p /sdcard/gui_screen.png
            adb pull /sdcard/gui_screen.png ./kenkephene_desktop.png
            echo "Đã chụp thành công giao diện đồ họa!"

      - name: Upload GUI Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KenkePhene-OS-GUI-View
          path: kenkephene_desktop.png
