name: KenkePhene Emulator Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator & Start OS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2000M
          heap-size: 256M
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Đang khởi động hệ điều hành KenkePhene OS..."
            adb wait-for-device
            
            # Chờ hệ thống boot hoàn tất 100%
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              echo "Hệ điều hành đang khởi động..."
              sleep 5
            done
            
            echo "KenkePhene OS đã khởi động thành công!"
            
            # Bật sáng màn hình, mở khóa và vào màn hình chính (Home)
            adb shell input keyevent 26
            adb shell input keyevent 82
            adb shell input keyevent 3
            
            echo "Đã đưa hệ điều hành về màn hình chính thành công!"
            
            # Kiểm tra danh sách tiến trình hệ thống đang chạy
            adb shell ps -A
