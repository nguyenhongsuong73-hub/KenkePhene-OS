name: KenkePhene Emulator Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator & Start OS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2000M
          heap-size: 256M
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Đang khởi động hệ điều hành KenkePhene OS..."
            adb wait-for-device
            
            # Chờ hệ thống boot hoàn tất
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              echo "Hệ điều hành đang khởi động..."
              sleep 5
            done
            
            echo "KenkePhene OS đã khởi động thành công!"
            
            # Mở khóa màn hình và về màn hình chính (Home)
            adb shell input keyevent 82
            adb shell input keyevent 3
            
            # Chụp ảnh màn hình hệ điều hành
            adb shell screencap -p /sdcard/kenkephene_screen.png
            adb pull /sdcard/kenkephene_screen.png ./kenkephene_screen.png
            echo "Đã chụp ảnh màn hình hệ điều hành thành công!"

      - name: Upload OS Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: KenkePhene-OS-Desktop
          path: kenkephene_screen.png
