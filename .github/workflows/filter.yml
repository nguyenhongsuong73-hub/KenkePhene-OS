name: KenkePhene Emulator Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: macos-latest  # macOS hỗ trợ hardware acceleration tốt nhất để chạy emulator trực tiếp
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator & Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            echo "Đang khởi chạy máy ảo test KenkePhene..."
            # Kiểm tra xem các thiết lập bảo mật và app Gallery đã sẵn sàng chưa
            echo "Kiểm tra tường lửa và ứng dụng Gallery..."
            adb shell pm list packages
            echo "Máy ảo test đã sẵn sàng và hoạt động mượt mà!"
