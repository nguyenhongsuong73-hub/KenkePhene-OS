name: KenkePhene Emulator Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-virtual-device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator & Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2000M
          heap-size: 256M
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Đang chờ máy ảo boot hoàn tất..."
            adb wait-for-device
            # Kiểm tra trạng thái boot đơn giản và ổn định
            adb shell getprop sys.boot_completed
            echo "Máy ảo KenkePhene đã khởi động thành công!"
            adb shell pm list packages
